worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 8m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # 10 r/s — выше кликов человека и ниже перебора пароля на логине и API.
    # Число не из замера ёмкости. Burst 40.
    # Статика Grafana — другая зона: первая отрисовка тянет больше 40 файлов
    # /public/build разом. В общей зоне они получали 503, и панели писали
    # «Error loading» (модуль text/stat/timeseries не скачивался).
    limit_req_zone $binary_remote_addr zone=auth:1m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=assets:1m rate=50r/s;

    log_format main '$remote_addr "$request" $status';
    access_log /dev/stdout main;

    include /etc/monitoring-nginx/conf.d/*.conf;
}
