worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 8m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # 10 r/s — выше кликов человека и ниже перебора пароля. Число не из замера ёмкости.
    # auth: логин и API, burst 40.
    # assets: только /public/. Та же скорость 10 r/s, burst 200.
    # limit_req срабатывает до auth_basic, поэтому отдельная и более быстрая
    # зона дала бы перебор htpasswd через /public/*. Общую зону с auth не
    # используем: первая отрисовка Grafana тянет больше 40 файлов и раньше
    # получала 503 («Error loading»).
    limit_req_zone $binary_remote_addr zone=auth:1m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=assets:1m rate=10r/s;

    log_format main '$remote_addr "$request" $status';
    access_log /dev/stdout main;

    include /etc/monitoring-nginx/conf.d/*.conf;
}
