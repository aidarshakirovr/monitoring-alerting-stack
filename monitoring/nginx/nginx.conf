worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 8m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # 10 r/s — выше кликов человека в Grafana и ниже перебора пароля.
    # Число не из замера ёмкости. Burst 40, чтобы живой UI не ловил 503.
    limit_req_zone $binary_remote_addr zone=auth:1m rate=10r/s;

    log_format main '$remote_addr "$request" $status';
    access_log /dev/stdout main;

    include /etc/monitoring-nginx/conf.d/*.conf;
}
