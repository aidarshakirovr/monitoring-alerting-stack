# Три порта внутри контейнера. Снаружи compose публикует их только на
# MONITORING_BIND_IP (по умолчанию 127.0.0.1). TLS и basic auth — на каждом.
# /healthz без пароля: это liveness прокси, без данных бэкендов.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080 ssl;
    server_name monitoring.example;

    ssl_certificate /etc/nginx/secrets/tls/server.crt;
    ssl_certificate_key /etc/nginx/secrets/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Своя зона, rate=10r/s, burst=200. Не зона auth: см. nginx.conf.
    location /public/ {
        auth_basic "monitoring";
        auth_basic_user_file /etc/nginx/secrets/proxy/htpasswd;
        limit_req zone=assets burst=200 nodelay;

        set $grafana_upstream grafana:3000;
        proxy_pass http://$grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
    }

    location / {
        auth_basic "monitoring";
        auth_basic_user_file /etc/nginx/secrets/proxy/htpasswd;
        limit_req zone=auth burst=40 nodelay;

        set $grafana_upstream grafana:3000;
        proxy_pass http://$grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Basic прокси не должен становиться паролем Grafana.
        proxy_set_header Authorization "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 8081 ssl;
    server_name monitoring.example;

    ssl_certificate /etc/nginx/secrets/tls/server.crt;
    ssl_certificate_key /etc/nginx/secrets/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        auth_basic "monitoring";
        auth_basic_user_file /etc/nginx/secrets/proxy/htpasswd;
        limit_req zone=auth burst=40 nodelay;

        set $prometheus_upstream prometheus:9090;
        proxy_pass http://$prometheus_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Basic прокси не должен становиться паролем Grafana.
        proxy_set_header Authorization "";
    }
}

server {
    listen 8082 ssl;
    server_name monitoring.example;

    ssl_certificate /etc/nginx/secrets/tls/server.crt;
    ssl_certificate_key /etc/nginx/secrets/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
