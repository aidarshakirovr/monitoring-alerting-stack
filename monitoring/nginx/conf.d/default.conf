    location / {
        auth_basic "monitoring";
        auth_basic_user_file /etc/nginx/secrets/proxy/htpasswd;
        limit_req zone=auth burst=40 nodelay;

        set $alertmanager_upstream alertmanager:9093;
        proxy_pass http://$alertmanager_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Basic прокси не должен становиться паролем Grafana.
        proxy_set_header Authorization "";
    }
}
