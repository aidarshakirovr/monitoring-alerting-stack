---
# Стек мониторинга. Образы закреплены тегом, не latest.
# Тег можно перевесить на Docker Hub; digest в этом репозитории не зафиксирован.
# pull_policy: if_not_present — перезапуск не тянет образ заново.
#
# Наружу опубликован только proxy, и только на MONITORING_BIND_IP
# (по умолчанию 127.0.0.1). Prometheus, Alertmanager, Grafana и экспортёры
# слушают сеть Docker. Авторизация человека — TLS и basic auth nginx,
# плюс собственный пароль Grafana.
#
# GRAFANA_ADMIN_PASSWORD обязателен и не имеет значения по умолчанию.
name: monitoring

services:
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: monitoring-prometheus
    pull_policy: if_not_present
    restart: unless-stopped
    user: "65534:65534"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - ../monitoring/prometheus/file_sd:/etc/prometheus/file_sd:ro
      - prometheus-data:/prometheus
    tmpfs:
      - /tmp:mode=1777
    networks:
      - monitoring
    logging: &json_log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  alertmanager:
    image: prom/alertmanager:v0.34.2
    container_name: monitoring-alertmanager
    pull_policy: if_not_present
    restart: unless-stopped
    user: "65534:65534"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
      - --cluster.listen-address=
    volumes:
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    tmpfs:
      - /tmp:mode=1777
    networks:
      - monitoring
    logging: *json_log
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  grafana:
    image: grafana/grafana:13.3.0
    container_name: monitoring-grafana
    pull_policy: if_not_present
    restart: unless-stopped
    user: "472:472"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://127.0.0.1:8443}
      GF_SERVER_HTTP_PORT: "3000"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_LOG_MODE: console
    volumes:
      - ../monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    tmpfs:
      - /tmp:mode=1777
    networks:
      - monitoring
    logging: *json_log
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: monitoring-node-exporter
    pull_policy: if_not_present
    restart: unless-stopped
    user: "65534:65534"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|host|etc)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fuse.*|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
      - --collector.textfile.directory=/textfile
      - --web.listen-address=:9100
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - ${NODE_EXPORTER_TEXTFILE_DIR:-/var/lib/node_exporter/textfile}:/textfile:ro
    tmpfs:
      - /tmp:mode=1777
    networks:
      - monitoring
    logging: *json_log
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.1
    container_name: monitoring-blackbox-exporter
    pull_policy: if_not_present
    restart: unless-stopped
    user: "65534:65534"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    command:
      - --config.file=/etc/blackbox/blackbox.yml
      - --web.listen-address=:9115
    volumes:
      - ../monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    tmpfs:
      - /tmp:mode=1777
    networks:
      - monitoring
    logging: *json_log
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9115/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  proxy:
    image: nginxinc/nginx-unprivileged:1.29.8-alpine
    container_name: monitoring-proxy
    pull_policy: if_not_present
    restart: unless-stopped
    user: "${NGINX_UID:-101}:${NGINX_GID:-101}"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    entrypoint: ["/bin/sh", "/etc/nginx/monitoring-entrypoint.sh"]
    ports:
      - "${MONITORING_BIND_IP:-127.0.0.1}:${MONITORING_GRAFANA_PORT:-8443}:8080"
      - "${MONITORING_BIND_IP:-127.0.0.1}:${MONITORING_PROMETHEUS_PORT:-8444}:8081"
      - "${MONITORING_BIND_IP:-127.0.0.1}:${MONITORING_ALERTMANAGER_PORT:-8445}:8082"
    volumes:
      - ../monitoring/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../monitoring/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../monitoring/nginx/empty:/etc/nginx/templates:ro
      - ../monitoring/nginx/docker-entrypoint.sh:/etc/nginx/monitoring-entrypoint.sh:ro
      - ./secrets/tls:/etc/nginx/secrets/tls:ro
      - ./secrets/htpasswd:/etc/nginx/secrets/htpasswd:ro
    # mode=1777: tmpfs создаёт root, а процесс nginx не root и должен сделать mkdir.
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
    networks:
      - monitoring
    logging: *json_log
    depends_on:
      grafana:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  monitoring:
    name: monitoring_internal
    driver: bridge

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
